<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Vine — Admin Curation Studio & Anti-Ambiguity Validator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080d1a;
      --panel: #111827;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #00f5d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
    }
    .admin-title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
    }
    .admin-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn {
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary {
      background: linear-gradient(135deg, #00f5d4, #10b981);
      color: #041311;
      border: none;
    }
    .meta-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .field-group label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field-group input, .field-group select {
      width: 100%;
      padding: 9px 10px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .validator-banner {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .validator-banner.ok {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }
    .validator-banner.err {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    .zone-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 22px;
    }
    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .zone-header h2 {
      font-size: 17px;
      font-weight: 800;
    }
    table.node-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.node-table th {
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    table.node-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    table.node-table input, table.node-table select {
      width: 100%;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div>
      <div class="admin-eyebrow">WORD VINE CONTENT PIPELINE & VALIDATOR</div>
      <h1 class="admin-title">Admin Vine Studio</h1>
    </div>

    <div class="toolbar">
      <select id="admin-vine-select" class="btn"></select>
      <button id="btn-test-z1" class="btn" type="button">▶️ Test Zone 1 (Roots)</button>
      <button id="btn-test-z2" class="btn" type="button">🪵 Test Zone 2 (Stem)</button>
      <button id="btn-test-z3" class="btn" type="button">⚡ Test Zone 3 (Canopy)</button>
      <button id="btn-save-sync" class="btn primary" type="button">💾 Save & Sync to API</button>
      <button id="btn-export-json" class="btn" type="button">📥 Export JSON</button>
      <a href="index.html" class="btn">🌿 Back to Game</a>
    </div>
  </header>

  <section class="meta-bar">
    <div class="field-group">
      <label>VINE NUMBER (#)</label>
      <input id="meta-number" type="number" />
    </div>
    <div class="field-group">
      <label>UTC DATE KEY (YYYY-MM-DD)</label>
      <input id="meta-date" type="text" />
    </div>
    <div class="field-group">
      <label>DAILY VINE TITLE</label>
      <input id="meta-title" type="text" />
    </div>
    <div class="field-group">
      <label>HD BOTANICAL THEME</label>
      <select id="meta-theme">
        <option value="0">Day 1: Midnight Bioluminescence</option>
        <option value="1">Day 2: Sunlit Conservatory</option>
        <option value="2">Day 3: Ukiyo-e Ink & Sakura</option>
      </select>
    </div>
  </section>

  <!-- Live Anti-Ambiguity Validator Status -->
  <div id="validator-banner" class="validator-banner ok">
    ✅ Anti-Ambiguity Check Passed: All 40 nodes form continuous forward compounds with zero decoy collisions.
  </div>

  <div id="zones-container"></div>

  <script src="js/data/dailyVines.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
